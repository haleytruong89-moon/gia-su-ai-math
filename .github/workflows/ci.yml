name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Every PR that changes the app must also update the progress map (docs/ROADMAP.json).
  roadmap:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ROADMAP.json updated with the code
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          code=$(echo "$changed" | grep -E '^(app|lib|cas|prompts|eval|e2e|knowledge|scripts)/|^vercel\.json$|^next\.config\.ts$' || true)
          if [ -n "$code" ] && ! echo "$changed" | grep -qx 'docs/ROADMAP.json'; then
            echo "::error file=docs/ROADMAP.json::PR đổi code nhưng chưa cập nhật docs/ROADMAP.json (bản đồ lộ trình). Sửa trạng thái lát/tính năng, PR, nhật ký và 'updated'."
            exit 1
          fi

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      # Knowledge files (D25): JSON matches knowledge/src, no private text (names come from a secret, never the repo).
      - run: npm run knowledge:check
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
      # Teaching cards (G6): JSON matches knowledge/src/cards, no private text. SymPy checks run in the cas job.
      - run: npm run cards:check
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
      # Build with placeholder values: NEXT_PUBLIC_* are inlined at build time; nothing is called.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_TELEMETRY_DISABLED: "1"

  cas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests

  # e2e on a real local Supabase built from the Study Launcher migrations (SQL lives there, D21)
  # and the fake model (no API call, no cost). Fake people only.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: haleytruong89-moon/study-launcher
          path: .launcher
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start local Supabase (Launcher migrations, schema tutor exposed like production D22)
        working-directory: .launcher
        run: |
          grep -q '^\[api\]' supabase/config.toml || printf '\n[api]\nschemas = ["public", "graphql_public", "tutor"]\n' >> supabase/config.toml
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor,realtime
          supabase status -o env > "$RUNNER_TEMP/sb.env"
      - name: Export local connection values
        run: |
          get() { grep "^$1=" "$RUNNER_TEMP/sb.env" | head -1 | cut -d= -f2- | tr -d '"'; }
          echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"
          echo "ANTHROPIC_API_KEY=fake-not-used" >> "$GITHUB_ENV"
          echo "NEXT_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start cas (private math checker, local)
        run: |
          pip install -q -r cas/requirements.txt uvicorn
          secret="ci-$(openssl rand -hex 16)"
          echo "CAS_SECRET=$secret" >> "$GITHUB_ENV"
          echo "CAS_URL=http://127.0.0.1:8100" >> "$GITHUB_ENV"
          (cd cas && CAS_SECRET="$secret" nohup uvicorn app.main:app --port 8100 > "$RUNNER_TEMP/cas.log" 2>&1 &)
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8100/health && break; sleep 1; done
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run end-to-end tests
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - name: Diagnostics on failure (shown as annotations on the check)
        if: failure()
        run: |
          annotate() {
            body="$(tail -n "$3" "$2" 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | sed 's/%/%25/g' | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=$1::${body}"
          }
          annotate "e2e output" "$RUNNER_TEMP/e2e.log" 70
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/e2e.log" | sed -n '/^  1) /,$p' | grep -v '^\s*$' | head -n 45 > "$RUNNER_TEMP/e2e-fail.log" || true
          annotate "e2e first failure" "$RUNNER_TEMP/e2e-fail.log" 45
